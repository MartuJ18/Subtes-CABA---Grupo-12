<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Servicio - Subte CABA</title>
    <link rel="stylesheet" href="../estilo/style.css">
</head>
<body>
    <div class="main-container">
        <nav class="nav">
            <div class="nav-logo">SUB<span>TE</span> CABA</div>
            <ul class="nav-links">
                <li><a href="../index.html">Volver al inicio</a></li>
                <li><a href="../servicios.html">Servicios</a></li>
            </ul>
        </nav>

        <main class="services-container">
            <h2 class="title-main">Estado del <span class="highlight">Servicio</span></h2>
            <p class="subtitle">Información actual de cada línea.</p>

            <div class="lines-list-container" id="lineas"></div>
        </main>

        <div class="info-bar">
            <div class="info-card">
                <div class="info-label">Estado de red</div>
                <div class="info-value">Normal</div>
                <div class="info-sub">Todas las líneas operativas</div>
            </div>
            <div class="info-card">
                <div class="info-label">Próximo Tren</div>
                <div class="info-value">4 min</div>
                <div class="info-sub">Frecuencia promedio</div>
            </div>
            <div class="info-card">
                <div class="info-label">Atención</div>
                <div class="info-value">0800</div>
                <div class="info-sub">Lunes a Viernes 8-20hs</div>
            </div>
        </div>
    </div>
   <script src="../Js/main.js"></script>
</body>
</html>
